name: ECU CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 0"

permissions:
  contents: read

concurrency:
  group: ecu-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (organization-policy compatible)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune --depth=1 origin "${GITHUB_REF}"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

      - name: Check project structure
        run: bash ci/scripts/check_project_structure.sh

      - name: Check repository hygiene
        run: bash ci/scripts/check_repo_hygiene.sh

  host-validation:
    name: Host firmware validation
    runs-on: ubuntu-latest
    needs: repo-checks
    steps:
      - name: Checkout repository (organization-policy compatible)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune --depth=1 origin "${GITHUB_REF}"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

      - name: Install host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc clang make python3

      - name: Run ECU host CI
        working-directory: host_tests
        run: |
          make CC=gcc clean
          make CC=gcc ci

      - name: Run ASan and UBSan qualification
        working-directory: host_tests
        run: |
          make CC=gcc asan
          make CC=gcc ubsan

      - name: Type-check complete ECU application
        run: bash ci/scripts/check_core_host_syntax.sh

      - name: Run full-source GCC analyzer
        run: bash ci/scripts/check_core_gcc_analyzer.sh

      - name: Run host-suite Clang analyzer
        working-directory: host_tests
        run: make CC=gcc CLANG=clang clang-analyze

  long-stress:
    name: Weekly/manual extended ECU stress
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: host-validation
    steps:
      - name: Checkout repository (organization-policy compatible)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune --depth=1 origin "${GITHUB_REF}"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

      - name: Install host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc make python3

      - name: Run extended deterministic stress
        working-directory: host_tests
        run: make CC=gcc stress-long

  stm32-headless-build:
    name: STM32 ARM-GCC build
    runs-on: ubuntu-latest
    needs: host-validation
    steps:
      - name: Checkout repository (organization-policy compatible)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune --depth=1 origin "${GITHUB_REF}"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

      - name: Install ARM GCC toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            libnewlib-arm-none-eabi \
            make \
            python3

      - name: Build ECU firmware headlessly
        run: bash ci/stm32/build_ecu_headless_gcc.sh

      - name: Generate firmware size report
        run: |
          mkdir -p ci_artifacts
          python3 ci/scripts/firmware_size_report.py \
            --elf build/DER26-ECU.elf \
            --out ci_artifacts/firmware_size_report.md

      - name: Check firmware size limits
        run: |
          python3 ci/scripts/check_firmware_size.py \
            --elf build/DER26-ECU.elf \
            --max-text 220000 \
            --max-data 16384 \
            --max-bss 81920

      - name: Add size report to workflow summary
        if: always()
        run: |
          if [ -f ci_artifacts/firmware_size_report.md ]; then
            cat ci_artifacts/firmware_size_report.md >> "$GITHUB_STEP_SUMMARY"
          fi
