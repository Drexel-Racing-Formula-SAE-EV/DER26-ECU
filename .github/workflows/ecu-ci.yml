name: ECU CI

on:
  pull_request:
    branches:
      - main
      - develop
      - "feature/**"
  push:
    branches:
      - main
      - develop
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecu-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-checks:
    name: Repo checks
    runs-on: ubuntu-latest
    steps:
      - name: Manual checkout without external actions
        run: |
          git init .
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD
      - name: Check project structure
        run: bash ci/scripts/check_project_structure.sh
      - name: Check repo hygiene
        run: bash ci/scripts/check_repo_hygiene.sh

  host-tests:
    name: ECU host tests and analyzer
    runs-on: ubuntu-latest
    needs: repo-checks
    steps:
      - name: Manual checkout without external actions
        run: |
          git init .
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD
      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc clang make
      - name: Run ECU unit tests
        working-directory: host_tests
        run: |
          make CC=gcc clean
          make CC=gcc unit | tee unit_test_output.txt
      - name: Run ECU host regression tests
        working-directory: host_tests
        run: make CC=gcc test | tee host_test_output.txt
      - name: Run AMS power-protocol conformance, producer golden vectors, and ECU integration tests
        working-directory: host_tests
        run: |
          make CC=gcc power-consumer | tee power_consumer_output.txt
          make CC=gcc power-integration | tee power_integration_output.txt
          make CC=gcc power-golden | tee power_golden_output.txt
      - name: Run ECU system SIL tests
        working-directory: host_tests
        run: make CC=gcc system-sil | tee system_sil_output.txt
      - name: Run extended deterministic fault-injection stress
        working-directory: host_tests
        run: make CC=gcc stress
      - name: Verify build-profile safety gates
        working-directory: host_tests
        run: make CC=gcc profile-gates
      - name: Type-check bench application and verify vehicle implementation lock
        run: bash ci/scripts/check_core_host_syntax.sh
      - name: Run ECU sanitizer tests
        working-directory: host_tests
        run: |
          make CC=gcc asan
          make CC=gcc ubsan
      - name: Run host-suite GCC analyzer
        working-directory: host_tests
        run: make CC=gcc analyze
      - name: Run host-suite Clang analyzer
        working-directory: host_tests
        run: make CC=gcc CLANG=clang clang-analyze
      - name: Run full bench-application GCC analyzer
        run: bash ci/scripts/check_core_gcc_analyzer.sh
      - name: Print host test output
        if: always()
        working-directory: host_tests
        run: |
          echo "===== unit_test_output.txt ====="
          test -f unit_test_output.txt && cat unit_test_output.txt || true
          echo "===== host_test_output.txt ====="
          test -f host_test_output.txt && cat host_test_output.txt || true
          echo "===== power_consumer_output.txt ====="
          test -f power_consumer_output.txt && cat power_consumer_output.txt || true
          echo "===== power_integration_output.txt ====="
          test -f power_integration_output.txt && cat power_integration_output.txt || true
          echo "===== power_golden_output.txt ====="
          test -f power_golden_output.txt && cat power_golden_output.txt || true
          echo "===== system_sil_output.txt ====="
          test -f system_sil_output.txt && cat system_sil_output.txt || true

  stm32-headless-build:
    name: STM32 headless ARM-GCC build
    runs-on: ubuntu-latest
    needs: host-tests
    steps:
      - name: Manual checkout without external actions
        run: |
          git init .
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD
      - name: Install ARM GCC toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi make python3
      - name: Build ECU firmware headlessly
        run: bash ci/stm32/build_ecu_headless_gcc.sh
      - name: Generate firmware size report
        run: |
          mkdir -p ci_artifacts
          python3 ci/scripts/firmware_size_report.py --elf build/DER26-ECU.elf --out ci_artifacts/firmware_size_report.md
      - name: Check firmware size limits
        run: python3 ci/scripts/check_firmware_size.py --elf build/DER26-ECU.elf --max-text 220000 --max-data 16384 --max-bss 81920
      - name: Print firmware build outputs
        if: always()
        run: |
          echo "===== Firmware build directory ====="
          ls -lh build || true
          echo "===== Firmware size report ====="
          test -f ci_artifacts/firmware_size_report.md && cat ci_artifacts/firmware_size_report.md || true
      - name: Write firmware size to workflow summary
        if: always()
        run: |
          if [ -f ci_artifacts/firmware_size_report.md ]; then
            cat ci_artifacts/firmware_size_report.md >> "$GITHUB_STEP_SUMMARY"
          fi
